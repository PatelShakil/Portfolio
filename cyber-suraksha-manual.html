<style>
:root{
  color-scheme:light;
  --bg:#F6F7FB; --surface:#FFFFFF; --ink:#151B33; --ink-2:#3D4666; --muted:#6B7390; --line:#E1E5F0;
  --accent:#E4590B; --accent-ink:#B4430A; --accent-soft:#FFF1E8;
  --navy:#1F3A93; --navy-soft:#EAF0FF;
  --safe:#178A57; --safe-soft:#E6F6EE; --safe-line:#B7E3CC;
  --danger:#C8321F; --danger-soft:#FDECEA; --danger-line:#F3B5AE;
  --warn:#9A6400; --warn-soft:#FFF7E0; --warn-line:#F2DE9E;
  --radius:16px;
  --font-body:"Noto Sans","Noto Sans Devanagari","Noto Sans Gujarati","Nirmala UI","Shruti",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Baloo 2","Baloo Bhai 2","Noto Sans Devanagari","Noto Sans Gujarati","Nirmala UI","Shruti",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;overflow-x:hidden}
body[data-lang="hi"],body[data-lang="gu"]{line-height:1.75}
img,svg{max-width:100%}
a{color:var(--navy)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px}
.tricolor{height:4px;background:linear-gradient(90deg,var(--accent) 0 34%,var(--navy) 34% 67%,var(--safe) 67%)}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:1.05rem;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.langs{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;padding-block:4px;-webkit-overflow-scrolling:touch}
.langs::-webkit-scrollbar{display:none}
.langs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.85rem;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:var(--font-body)}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* hero */
.hero{padding-block:34px 22px}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);margin:0}
h1{font-family:var(--font-display);font-size:clamp(2.05rem,6.4vw,3.3rem);line-height:1.08;margin:.3em 0 .35em;text-wrap:balance;letter-spacing:-.01em}
.lead{font-size:1.1rem;color:var(--ink-2);max-width:62ch;margin:0}
.author{display:flex;align-items:center;gap:12px;margin-top:22px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);flex-wrap:wrap}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--navy);object-fit:cover;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--navy-soft)}
.author .who{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.author .who small{color:var(--muted);font-size:.8rem}
.author .who b{font-size:1.02rem}
.author .li{margin-left:auto;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:.9rem;background:var(--navy-soft);color:var(--navy);padding:8px 12px;border-radius:999px;white-space:nowrap}
.toc{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:600;font-size:.88rem}
.chip .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:.72rem;font-weight:700}
/* sections */
.section{padding-block:38px;border-top:1px solid var(--line);scroll-margin-top:76px}
.section h2{font-family:var(--font-display);font-size:clamp(1.65rem,4.6vw,2.35rem);line-height:1.12;margin:.15em 0 .4em;text-wrap:balance}
.section h3{font-family:var(--font-display);font-size:1.3rem;line-height:1.2;margin:1.6em 0 .5em}
.intro{max-width:66ch;color:var(--ink-2);margin:0;font-size:1.04rem}
.facts{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px}
.facts li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.facts li svg{width:22px;height:22px;flex:none;margin-top:2px}
.steps{display:grid;gap:16px;margin-top:22px}
.step{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:14px 26px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.step .txt{display:flex;flex-direction:column;gap:6px}
.step .num{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.step .num i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:.9rem}
.step h4{font-family:var(--font-display);font-size:1.28rem;line-height:1.2;margin:0}
.step p{margin:0;color:var(--ink-2)}
.phone{width:100%;max-width:230px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 6px 14px rgba(21,27,51,.14))}
.phone .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.55);opacity:0}}
@media (prefers-reduced-motion:reduce){.phone .pulse{animation:none;display:none}html{scroll-behavior:auto}}
.duo{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:18px 28px;align-items:start;margin-top:22px}
.duo .phone{max-width:250px}
.callout{border-radius:14px;padding:14px 16px;display:flex;gap:12px;margin-top:20px;border:1px solid;align-items:flex-start}
.callout svg{width:24px;height:24px;flex:none;margin-top:2px}
.callout p{margin:0}
.callout b{display:block;margin-bottom:2px}
.callout.danger{background:var(--danger-soft);border-color:var(--danger-line);color:#6E1B11}
.callout.safe{background:var(--safe-soft);border-color:var(--safe-line);color:#0F4D31}
.callout.info{background:var(--navy-soft);border-color:#C5D3F5;color:#17306F}
.callout.warn{background:var(--warn-soft);border-color:var(--warn-line);color:#5C3B00}
.list{margin:12px 0 0;padding-left:0;list-style:none;display:grid;gap:8px}
.list li{position:relative;padding-left:28px}
.list li::before{content:"";position:absolute;left:0;top:.5em;width:16px;height:16px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent)}
.list.no li::before{background:var(--danger-soft);border-color:var(--danger)}
.list.ok li::before{background:var(--safe-soft);border-color:var(--safe)}
.olist{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.olist li{position:relative;padding-left:40px;counter-increment:s}
.olist li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.big{font-family:var(--font-display);font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.2;margin:26px 0 0;padding:18px 20px;border-radius:18px;background:var(--ink);color:#fff;text-wrap:balance}
.big span{color:#FFB98A}
.note{font-size:.9rem;color:var(--muted);margin-top:14px}
.olink{display:inline-flex;align-items:center;gap:6px;font-weight:600;margin-top:12px}
/* permissions */
.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px;margin-top:16px}
.perm{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;display:flex;flex-direction:column;gap:9px}
.perm h4{margin:0;font-family:var(--font-display);font-size:1.15rem;display:flex;align-items:center;gap:9px;line-height:1.2}
.perm h4 span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--navy-soft);font-size:1.15rem;flex:none}
.perm .r{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.93rem;align-items:start;line-height:1.45}
.perm .r i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-style:normal;font-weight:700;font-size:.8rem;color:#fff;margin-top:2px}
.perm .r.ok i{background:var(--safe)} .perm .r.no i{background:var(--danger)}
.perm .r b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dlg{display:grid;gap:10px;margin-top:14px}
.dlg div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.dlg b{font-family:var(--font-display);font-size:1.05rem}
.dlg .k1 b{color:var(--navy)} .dlg .k2 b{color:var(--warn)} .dlg .k3 b{color:var(--safe)}
/* scams */
.scams{display:grid;gap:12px;margin-top:20px}
.scam{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}
.scam h4{font-family:var(--font-display);font-size:1.22rem;margin:0;line-height:1.2;display:flex;gap:10px;align-items:baseline}
.scam h4 em{font-style:normal;color:var(--accent-ink);font-size:.85rem;font-family:var(--font-body)}
.scam .row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;font-size:.95rem;line-height:1.5}
.scam .row .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);padding-top:4px}
.scam .row.act .v{color:#0F4D31;background:var(--safe-soft);border-radius:10px;padding:8px 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:.82rem;font-weight:700;background:var(--navy-soft);color:var(--navy);padding:4px 10px;border-radius:999px;border:1px solid #C5D3F5}
.tag.hot{background:var(--accent);color:#fff;border-color:var(--accent)}
/* helplines */
.hl-list{display:grid;gap:10px;margin-top:16px}
.hl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;scroll-margin-top:80px}
.hl .pri{font-family:var(--font-display);font-size:1.6rem;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums;word-break:break-word;user-select:all;-webkit-user-select:all}
.hl .pri.host{font-family:var(--font-body);font-size:1rem;font-weight:700;padding-top:4px}
.hl .sec{font-size:.88rem;color:var(--navy);word-break:break-word}
.hl .lbl{font-weight:600;line-height:1.35;margin-top:2px}
.hl .note{grid-column:1/-1;font-size:.9rem;color:var(--ink-2);margin-top:4px}
.hl .acts{display:flex;gap:6px;grid-column:2;grid-row:1/3;flex-wrap:wrap;justify-content:flex-end}
.bt{font:inherit;font-weight:600;font-size:.82rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-family:var(--font-body)}
.bt.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.bt.done{background:var(--safe);color:#fff;border-color:var(--safe)}
.hl.hot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* checklist */
.check{display:grid;gap:8px;margin-top:16px}
.check label{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--safe);margin:2px 0 0;flex:none}
.check input:checked + span{text-decoration:line-through;color:var(--muted)}
/* share */
.share-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:20px}
.share-box h3{margin:0 0 4px}
.share-box p{margin:0 0 12px;color:var(--ink-2)}
.share{display:flex;flex-wrap:wrap;gap:8px}
.share a,.share button{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font:inherit;font-weight:600;color:var(--ink);text-decoration:none;font-size:.92rem;cursor:pointer;font-family:var(--font-body)}
.share svg{width:18px;height:18px}
.share .wa{background:#1FA855;color:#fff;border-color:transparent}
.share .fb{background:#1877F2;color:#fff;border-color:transparent}
.share .x{background:#111;color:#fff;border-color:transparent}
.share .li{background:#0A66C2;color:#fff;border-color:transparent}
.share .tg{background:#229ED9;color:#fff;border-color:transparent}
.share button.done{background:var(--safe);color:#fff;border-color:var(--safe)}
/* footer */
footer{border-top:1px solid var(--line);background:var(--surface);padding-block:30px 40px;margin-top:20px}
footer .wrap{display:grid;gap:18px}
footer p{margin:0;color:var(--ink-2)}
footer .src{display:flex;flex-wrap:wrap;gap:6px}
footer .src a{font-size:.85rem;text-decoration:none;background:var(--bg);border:1px solid var(--line);padding:5px 10px;border-radius:999px;color:var(--navy);font-weight:600}
footer .fine{font-size:.85rem;color:var(--muted)}
@media (max-width:470px){.brand span{display:none}.langs button{padding:6px 10px}}
@media (max-width:640px){
  .step{grid-template-columns:1fr;padding:14px}
  .duo{grid-template-columns:1fr}
  .hl{grid-template-columns:1fr}
  .hl .acts{grid-column:1;grid-row:auto;justify-content:flex-start;margin-top:8px}
  .author .li{margin-left:0}
  .scam .row{grid-template-columns:1fr;gap:2px}
}
@media print{.topbar,.share-box,.toc{display:none}.phone{filter:none}}
</style>

  rule2:{
    eyebrow:"Habit 2 of 3", title:"Never install an APK file from anywhere",
    intro:"An .apk file is an app that did not come through the Play Store. Nobody checked it. Scammers send APK files on WhatsApp, Telegram, SMS and websites, dressed up as something you want to open. One tap can give them your SMS, your OTPs and your bank balance.",
    commonTitle:"APK files scammers send in India",
    common:["'Wedding invitation.apk' or 'Party invitation.apk' from an unknown number.","'Traffic challan.apk', 'RTO e-challan' or 'court notice'.","'PM Kisan', 'Ayushman', 'Ration card' or any 'government scheme' app link.","'Bank KYC update.apk', 'SBI reward points', 'credit card points redeem'.","'Electricity bill pending, pay now' with a file to install.","Games, 'mod' apps, free Hotstar/Netflix and 'earn money' apps from outside the Play Store."],
    rulesTitle:"Simple rules",
    rules:["Install apps only from the Play Store app on your phone. Nothing else.","If a file name ends with .apk, do not tap it. Delete the message.","A real bank, police station, court or government office never sends an app on WhatsApp.","Already installed one? Switch on Airplane mode, uninstall it, run a Play Protect scan, and call your bank."],
    checkTitle:"Check that 'Install unknown apps' is OFF",
    check:["Open Settings on your phone and search for 'unknown apps' (or 'Install unknown apps').","You will see a list of apps like Chrome, WhatsApp and Files.","Every app should say 'Not allowed'. If any says 'Allowed', tap it and switch it OFF."],
    searchTip:"Phone brands hide this setting in different places. The search bar at the top of Settings finds it on every phone.",
    remember:"Remember: Play Store only. No APK. Ever."
  },
  rule3:{
    eyebrow:"Habit 3 of 3", title:"Give apps only the permissions they truly need",
    intro:"When an app asks 'Allow X to access your contacts?', it is asking for the key to a room in your house. Ask one question before you tap: does this app need this to do its main job? A camera app needs the camera. A torch app, a calculator or a game does not need your contacts, SMS or location.",
    oneRule:"The one-question rule: Is this permission needed for the app's main job? If not, tap Don't allow. You can always allow it later.",
    dialogTitle:"The permission pop-up: what the 3 buttons mean",
    dialog:[
      {b:"While using the app", d:"The app can use it only while it is open on screen. Best choice for camera, microphone and location when the app really needs them."},
      {b:"Only this time", d:"One-time access. Great when you are not sure. The app must ask again next time."},
      {b:"Don't allow", d:"The safest choice. The app still works for everything else."}
    ],
    permsTitle:"Permission by permission",
    perms:[
      {n:"Camera", i:"📷", ok:"Camera, video calling, scanner, your bank app for video KYC", no:"Torch, calculator, games, wallpapers, 'cleaner' apps"},
      {n:"Microphone", i:"🎤", ok:"Calling, voice notes, voice recorder", no:"Games, shopping, news, torch apps"},
      {n:"Location", i:"📍", ok:"Maps, cab, food delivery (choose 'While using the app')", no:"Games, wallpapers, photo editors, loan apps"},
      {n:"Contacts", i:"👥", ok:"WhatsApp, Truecaller, phone dialer, email", no:"Loan apps, games, 'earn money' apps, photo editors"},
      {n:"SMS", i:"💬", ok:"Only your default messages app. A bank/UPI app may ask once to verify your SIM.", no:"Everything else. Any app that can read your SMS can read your OTPs."},
      {n:"Phone & call logs", i:"📞", ok:"Dialer, Truecaller, WhatsApp calling", no:"Games, loan apps, shopping apps"},
      {n:"Files & photos", i:"🖼️", ok:"Gallery, WhatsApp (to send photos), file manager", no:"Loan apps, games, 'free recharge' apps"},
      {n:"Notifications", i:"🔔", ok:"Apps whose alerts you actually want", no:"Anything that spams you; you can switch it off later in Settings"}
    ],
    dangerTitle:"Red-flag permissions: almost never say yes",
    danger:["Accessibility service: lets an app see and control everything on your screen, including your bank app. Only for real accessibility tools for disabled users.","Display over other apps: lets an app draw fake screens on top of your bank app.","Device admin: the app cannot be uninstalled the normal way.","Install unknown apps: lets that app install other apps silently.","Notification access: the app can read every notification, including OTPs.","Read SMS inside a loan, game or 'reward' app: this is how OTP theft happens."],
    managerTitle:"Review the permissions you already gave",
    manager:["Open Settings and search 'Permission manager' (on some phones: Privacy, then Permission manager).","Tap a permission like SMS, Contacts or Location to see which apps have it.","Remove it from any app that does not need it. The app keeps working."],
    tip:"Do this once for SMS, Contacts, Location, Microphone and Camera. It takes 5 minutes."
  },
  scams:{
    eyebrow:"Know the scam, know the number", title:"Common scams in India and what to do",
    intro:"Scammers create panic or greed so that you act fast. The moment someone rushes you, stop. Below: how each scam looks, the first thing to do, and where to report.",
    goldenTitle:"If money has already left your account",
    golden:"Call 1930 right now, before anything else. The sooner you call, the better the chance that the money is frozen before the scammer withdraws it. Then file a complaint on cybercrime.gov.in and inform your bank.",
    k:{looks:"How it looks", act:"Do this", report:"Report here"},
    items:[
      {n:"UPI / OTP fraud", looks:"'Your account will be blocked, share the OTP.' 'Pay ₹1 to receive ₹5,000.' A 'collect request' that asks for your PIN.", act:"Never share an OTP or UPI PIN. Entering your PIN always sends money, never receives it. Call 1930 if money went out.", report:["h1930","cybercrime","bank"]},
      {n:"Digital arrest / fake police-CBI video call", looks:"Video call from a 'CBI / police / customs' officer. 'Your parcel has drugs.' 'Your Aadhaar is linked to money laundering.' They keep you on the call for hours.", act:"Police never arrest anyone on a video call or ask for money. Cut the call. Call 1930 or 112.", report:["h1930","cybercrime","h112"]},
      {n:"APK file on WhatsApp", looks:"Wedding invitation, e-challan, bank KYC or PM-Kisan file whose name ends in .apk.", act:"Don't tap. If installed: Airplane mode, uninstall, Play Protect scan, call your bank.", report:["h1930","cybercrime","chakshu"]},
      {n:"Fake loan app", looks:"Instant loan app from outside the Play Store. Takes your contacts and photos, then threats and morphed photos are sent to your contacts.", act:"Do not pay. Take screenshots. Report to police and RBI Sachet. Warn your contacts.", report:["cybercrime","sachet","h1930"]},
      {n:"Sextortion / morphed photos", looks:"Video call from an unknown number, recording, then blackmail.", act:"Do not pay. Do not delete the evidence. Report immediately. You are the victim, not the accused.", report:["cybercrime","h1930","h181","h1098"]},
      {n:"Job / task / investment scam", looks:"'Like YouTube videos and earn.' 'Part-time job.' Telegram trading group with guaranteed returns. Small profit first, then a big loss.", act:"Stop sending money. Guaranteed returns do not exist. Call 1930.", report:["h1930","cybercrime","sachet"]},
      {n:"Fake customer care number", looks:"Google search shows a fake bank, airline or courier number. They ask you to install AnyDesk or share your screen.", act:"Use only the number printed on your card or inside the official app. Never install a screen-sharing app for support.", report:["h1930","cybercrime","bank"]},
      {n:"SIM swap / SIM suddenly dead", looks:"Your phone suddenly shows no network while OTPs go to the scammer.", act:"From another phone, call your telecom operator and your bank immediately.", report:["bank","tafcop","h1930"]},
      {n:"Lost or stolen phone", looks:"Phone gone with bank apps and SIM inside.", act:"Block the SIM with your operator, block the phone on CEIR, change passwords, tell your bank.", report:["ceir","h112"]},
      {n:"KYC / electricity / Aadhaar update scam", looks:"'KYC expired, update now or account blocked.' A link or a call. 'Electricity will be cut tonight.'", act:"Banks and electricity companies do not cut service by SMS at night. Use only the official app or visit the branch.", report:["chakshu","h1930","cybercrime"]},
      {n:"Spam and fraud calls or SMS", looks:"Unknown number, foreign +92 / +1 call, promotional SMS.", act:"Don't call back. Report the number on Chakshu. Activate DND.", report:["chakshu","h1909"]}
    ]
  },

    golden:"सबसे पहले, अभी 1930 पर कॉल करें। जितनी जल्दी कॉल करेंगे, उतनी ज़्यादा संभावना है कि ठग के निकालने से पहले पैसा फ़्रीज़ हो जाए। फिर cybercrime.gov.in पर शिकायत दर्ज करें और अपने बैंक को बताएँ।",
    k:{looks:"कैसी दिखती है", act:"यह करें", report:"यहाँ शिकायत करें"},
    items:[
      {n:"UPI / OTP ठगी", looks:"'आपका खाता बंद हो जाएगा, OTP बताएँ।' '₹5,000 पाने के लिए ₹1 भेजें।' ऐसी 'collect request' जो आपका PIN माँगे।", act:"OTP या UPI PIN कभी न बताएँ। PIN डालने से पैसा हमेशा जाता है, कभी आता नहीं। पैसा गया हो तो 1930 पर कॉल करें।", report:["h1930","cybercrime","bank"]},
      {n:"डिजिटल अरेस्ट / नकली पुलिस-CBI वीडियो कॉल", looks:"'CBI / पुलिस / कस्टम' अधिकारी का वीडियो कॉल। 'आपके पार्सल में ड्रग्स हैं।' 'आपका आधार मनी लॉन्ड्रिंग से जुड़ा है।' घंटों कॉल पर रोके रखते हैं।", act:"पुलिस कभी वीडियो कॉल पर गिरफ़्तार नहीं करती और न पैसे माँगती है। कॉल काटें। 1930 या 112 पर कॉल करें।", report:["h1930","cybercrime","h112"]},
      {n:"WhatsApp पर APK फ़ाइल", looks:"शादी का निमंत्रण, e-challan, बैंक KYC या PM-Kisan फ़ाइल जिसका नाम .apk पर ख़त्म हो।", act:"टैप न करें। इंस्टॉल हो गया हो तो: Airplane mode, अनइंस्टॉल, Play Protect स्कैन, बैंक को कॉल।", report:["h1930","cybercrime","chakshu"]},
      {n:"नकली लोन ऐप", looks:"Play Store के बाहर का इंस्टेंट लोन ऐप। कॉन्टैक्ट और फ़ोटो लेता है, फिर धमकियाँ और आपके कॉन्टैक्ट्स को बदली हुई फ़ोटो भेजता है।", act:"पैसे न दें। स्क्रीनशॉट लें। पुलिस और RBI Sachet पर शिकायत करें। अपने कॉन्टैक्ट्स को आगाह करें।", report:["cybercrime","sachet","h1930"]},
      {n:"सेक्सटॉर्शन / बदली हुई फ़ोटो", looks:"अनजान नंबर से वीडियो कॉल, रिकॉर्डिंग, फिर ब्लैकमेल।", act:"पैसे न दें। सबूत डिलीट न करें। तुरंत शिकायत करें। आप पीड़ित हैं, अपराधी नहीं।", report:["cybercrime","h1930","h181","h1098"]},
      {n:"नौकरी / टास्क / निवेश ठगी", looks:"'YouTube वीडियो लाइक करो और कमाओ।' 'पार्ट-टाइम जॉब।' गारंटीड रिटर्न वाला Telegram ट्रेडिंग ग्रुप। पहले छोटा मुनाफ़ा, फिर बड़ा नुकसान।", act:"पैसे भेजना बंद करें। गारंटीड रिटर्न होता ही नहीं। 1930 पर कॉल करें।", report:["h1930","cybercrime","sachet"]},
      {n:"नकली कस्टमर केयर नंबर", looks:"Google सर्च में बैंक, एयरलाइन या कूरियर का नकली नंबर। वे AnyDesk इंस्टॉल करने या स्क्रीन शेयर करने को कहते हैं।", act:"सिर्फ़ कार्ड के पीछे छपा नंबर या आधिकारिक ऐप इस्तेमाल करें। सपोर्ट के लिए कभी स्क्रीन-शेयरिंग ऐप इंस्टॉल न करें।", report:["h1930","cybercrime","bank"]},
      {n:"SIM स्वैप / SIM अचानक बंद", looks:"फ़ोन में अचानक नेटवर्क नहीं, और इसी बीच OTP ठग के पास जाते हैं।", act:"दूसरे फ़ोन से तुरंत अपनी टेलीकॉम कंपनी और बैंक को कॉल करें।", report:["bank","tafcop","h1930"]},
      {n:"फ़ोन खो गया या चोरी", looks:"बैंक ऐप और SIM के साथ फ़ोन गायब।", act:"ऑपरेटर से SIM ब्लॉक करवाएँ, CEIR पर फ़ोन ब्लॉक करें, पासवर्ड बदलें, बैंक को बताएँ।", report:["ceir","h112"]},
      {n:"KYC / बिजली / आधार अपडेट ठगी", looks:"'KYC ख़त्म, अभी अपडेट करें वरना खाता बंद।' लिंक या कॉल। 'आज रात बिजली कट जाएगी।'", act:"बैंक और बिजली कंपनी रात में SMS से सेवा नहीं काटते। सिर्फ़ आधिकारिक ऐप इस्तेमाल करें या शाखा में जाएँ।", report:["chakshu","h1930","cybercrime"]},
      {n:"स्पैम और ठगी वाले कॉल या SMS", looks:"अनजान नंबर, विदेशी +92 / +1 कॉल, प्रचार वाले SMS।", act:"वापस कॉल न करें। Chakshu पर नंबर की शिकायत करें। DND चालू करें।", report:["chakshu","h1909"]}

  rule1:{
    eyebrow:"આદત 1 / 3", title:"Google Play Protect હંમેશાં ON રાખો",
    intro:"Play Protect ગૂગલનો મફત સુરક્ષા ગાર્ડ છે જે Play Store ની અંદર રહે છે. તે ફોનની દરેક એપ તપાસે છે અને હાનિકારક એપ મળે તો ચેતવણી આપે છે અથવા તેને દૂર કરે છે. તે પહેલેથી ON હોય છે, પણ ઠગો ઘણી વાર લોકો પાસે તેને OFF કરાવી દે છે. આજે એક વાર તપાસો, અને જ્યારે પણ કોઈ તમારા ફોનમાં 'મદદ' કરે ત્યારે ફરી તપાસો.",
    whatTitle:"Play Protect તમારા માટે શું કરે છે",
    what:["Play Store માંથી ડાઉનલોડ કરતાં પહેલાં એપ્સ તપાસે છે.","બીજી જગ્યાએથી (WhatsApp, બ્રાઉઝર, SD કાર્ડ) આવેલી એપ્સ સ્કેન કરે છે.","હાનિકારક એપ પર ચેતવણી આપે છે, તેને બંધ કરે છે અથવા આપોઆપ દૂર કરે છે."],
    stepsTitle:"ON છે કે નહીં, આમ તપાસો (4 ટૅપ)",
    steps:[
      {t:"Play Store એપ ખોલો", d:"ઉપર જમણા ખૂણે ગોળ પ્રોફાઇલ ફોટો (અથવા તમારા નામનો અક્ષર) પર ટૅપ કરો."},
      {t:"'Play Protect' પર ટૅપ કરો", d:"મેનૂમાં ઢાલ (શીલ્ડ) ના નિશાન સાથે મળશે. અહીં એ પણ દેખાશે કે ફોન છેલ્લે ક્યારે સ્કેન થયો."},
      {t:"સેટિંગ્સ ગિયર પર ટૅપ કરો", d:"તે Play Protect સ્ક્રીનના ઉપર જમણા ખૂણે છે."},
      {t:"બંને સ્વિચ ON કરો", d:"'Scan apps with Play Protect' ON હોવું જોઈએ. 'Improve harmful app detection' પણ ON કરો. લીલી સ્વિચ = સુરક્ષિત."}
    ],
    afterTitle:"જો Play Protect ને કોઈ ખરાબ એપ મળે તો?",
    after:["તમને નોટિફિકેશન આવશે. તેના પર ટૅપ કરો, પછી Uninstall દબાવો.","કેટલીક એપ્સ ત્યાં સુધી બંધ રહે છે જ્યાં સુધી તમે તેને દૂર ન કરો.","બહુ ખતરનાક એપ્સ આપોઆપ દૂર થઈ જાય છે અને તમને તેનો સંદેશ મળે છે."],
    warning:"કોઈ કૉલ કરનાર, મેસેજ કે 'કસ્ટમર કેર' વાળાના કહેવાથી Play Protect ક્યારેય OFF ન કરો. એ માંગણી જ ઠગાઈ છે.",
    tip:"મહિનામાં એક વાર Play Protect સ્ક્રીન પર 'Scan' પણ દબાવો.",
    note:"Samsung, Xiaomi, Vivo, Oppo કે Realme ફોનમાં મેનૂનાં નામ થોડાં અલગ દેખાઈ શકે, પણ Play Store ના આ સ્ટેપ દરેક Android પર સરખા છે."
  },
  rule2:{
    eyebrow:"આદત 2 / 3", title:"ક્યાંયથી પણ APK ફાઇલ ઇન્સ્ટૉલ ન કરો",
    intro:".apk ફાઇલ એ એપ છે જે Play Store માંથી નથી આવી. તેને કોઈએ તપાસી નથી. ઠગો WhatsApp, Telegram, SMS અને વેબસાઇટ પર APK ફાઇલ મોકલે છે, એવી વસ્તુના નામે જે તમે ખોલવા માંગો. એક ટૅપથી તેમને તમારા SMS, OTP અને બેંક બેલેન્સ મળી શકે.",
    commonTitle:"ભારતમાં ઠગો કઈ APK મોકલે છે",
    common:["અજાણ્યા નંબરથી 'Wedding invitation.apk' કે 'Party invitation.apk'.","'Traffic challan.apk', 'RTO e-challan' કે 'court notice'.","'PM Kisan', 'Ayushman', 'Ration card' કે કોઈ પણ 'સરકારી યોજના' એપ લિંક.","'Bank KYC update.apk', 'SBI reward points', 'credit card points redeem'.","'વીજળી બિલ બાકી, હમણાં ભરો' સાથે ઇન્સ્ટૉલ કરવાની ફાઇલ.","Play Store બહારની ગેમ, 'mod' એપ, ફ્રી Hotstar/Netflix અને 'પૈસા કમાઓ' એપ."],
    rulesTitle:"સરળ નિયમો",
    rules:["ફક્ત તમારા ફોનની Play Store એપમાંથી જ એપ ઇન્સ્ટૉલ કરો. બીજે ક્યાંયથી નહીં.","ફાઇલનું નામ .apk થી પૂરું થાય તો ટૅપ ન કરો. મેસેજ ડિલીટ કરો.","અસલી બેંક, પોલીસ, કોર્ટ કે સરકારી કચેરી ક્યારેય WhatsApp પર એપ મોકલતી નથી.","ઇન્સ્ટૉલ કરી દીધી છે? Airplane mode ON કરો, એપ અનઇન્સ્ટૉલ કરો, Play Protect સ્કેન ચલાવો અને બેંકને ફોન કરો."],
    checkTitle:"તપાસો કે 'Install unknown apps' OFF છે",
    check:["ફોનની Settings ખોલો અને 'unknown apps' (કે 'Install unknown apps') શોધો.","Chrome, WhatsApp, Files જેવી એપ્સની યાદી દેખાશે.","દરેક એપ નીચે 'Not allowed' હોવું જોઈએ. જો કોઈમાં 'Allowed' હોય તો તેના પર ટૅપ કરીને OFF કરો."],
    searchTip:"દરેક બ્રાન્ડ આ સેટિંગ અલગ જગ્યાએ છુપાવે છે. Settings ની ઉપરનું સર્ચ બાર દરેક ફોનમાં તેને શોધી આપે છે.",
    remember:"યાદ રાખો: ફક્ત Play Store. APK ક્યારેય નહીં."
  },
  rule3:{
    eyebrow:"આદત 3 / 3", title:"એપને ફક્ત એ જ પરવાનગી આપો જેની તેને ખરેખર જરૂર છે",
    intro:"જ્યારે એપ પૂછે 'Allow X to access your contacts?', ત્યારે તે તમારા ઘરના એક ઓરડાની ચાવી માંગે છે. ટૅપ કરતાં પહેલાં એક સવાલ પૂછો: શું આ એપને પોતાનું મુખ્ય કામ કરવા માટે આ જોઈએ? કૅમેરા એપને કૅમેરા જોઈએ. ટૉર્ચ એપ, કૅલ્ક્યુલેટર કે ગેમને તમારા કૉન્ટેક્ટ, SMS કે લોકેશન જોઈતાં નથી.",
    oneRule:"એક-સવાલનો નિયમ: શું આ પરવાનગી એપના મુખ્ય કામ માટે જરૂરી છે? ના, તો Don't allow દબાવો. પછી ગમે ત્યારે આપી શકો છો.",
    dialogTitle:"પરવાનગીનું પૉપ-અપ: 3 બટનનો અર્થ",
    dialog:[
      {b:"While using the app", d:"એપ તેનો ઉપયોગ ફક્ત ત્યારે કરી શકે જ્યારે તે સ્ક્રીન પર ખુલ્લી હોય. કૅમેરા, માઇક અને લોકેશન માટે શ્રેષ્ઠ પસંદગી, જ્યારે એપને ખરેખર જોઈએ."},
      {b:"Only this time", d:"ફક્ત એક વાર. જ્યારે ખાતરી ન હોય ત્યારે યોગ્ય. આગલી વખતે એપે ફરી પૂછવું પડશે."},
      {b:"Don't allow", d:"સૌથી સુરક્ષિત પસંદગી. એપ બાકીનું બધું કામ તો પણ કરશે."}
    ],
    permsTitle:"એક-એક પરવાનગી સમજો",
    perms:[
      {n:"કૅમેરા", i:"📷", ok:"કૅમેરા, વીડિયો કૉલ, સ્કૅનર, વીડિયો KYC માટે બેંક એપ", no:"ટૉર્ચ, કૅલ્ક્યુલેટર, ગેમ, વૉલપેપર, 'ક્લીનર' એપ"},
      {n:"માઇક્રોફોન", i:"🎤", ok:"કૉલિંગ, વૉઇસ નોટ, વૉઇસ રેકોર્ડર", no:"ગેમ, શૉપિંગ, ન્યૂઝ, ટૉર્ચ એપ"},
      {n:"લોકેશન", i:"📍", ok:"Maps, કૅબ, ફૂડ ડિલિવરી ('While using the app' પસંદ કરો)", no:"ગેમ, વૉલપેપર, ફોટો એડિટર, લોન એપ"},
      {n:"કૉન્ટેક્ટ", i:"👥", ok:"WhatsApp, Truecaller, ફોન ડાયલર, ઈમેલ", no:"લોન એપ, ગેમ, 'પૈસા કમાઓ' એપ, ફોટો એડિટર"},
      {n:"SMS", i:"💬", ok:"ફક્ત તમારી ડિફૉલ્ટ મેસેજ એપ. બેંક/UPI એપ SIM તપાસવા એક વાર માંગી શકે.", no:"બાકી બધું. જે એપ તમારા SMS વાંચી શકે, તે તમારા OTP વાંચી શકે."},
      {n:"ફોન અને કૉલ લૉગ", i:"📞", ok:"ડાયલર, Truecaller, WhatsApp કૉલિંગ", no:"ગેમ, લોન એપ, શૉપિંગ એપ"},
      {n:"ફાઇલો અને ફોટા", i:"🖼️", ok:"ગૅલેરી, WhatsApp (ફોટા મોકલવા), ફાઇલ મૅનેજર", no:"લોન એપ, ગેમ, 'ફ્રી રિચાર્જ' એપ"},
      {n:"નોટિફિકેશન", i:"🔔", ok:"જે એપ્સનાં એલર્ટ તમે ખરેખર ઇચ્છો છો", no:"જે તમને હેરાન કરે; પછી Settings માં બંધ કરી શકો"}
    ],
    dangerTitle:"જોખમી પરવાનગીઓ: આમને લગભગ ક્યારેય હા ન કહો",
    danger:["Accessibility service: એપ તમારી સ્ક્રીન પરનું બધું જોઈ અને ચલાવી શકે, બેંક એપ પણ. ફક્ત દિવ્યાંગ વપરાશકર્તાઓનાં અસલી સહાયક ટૂલ માટે.","Display over other apps: એપ તમારી બેંક એપ ઉપર નકલી સ્ક્રીન બનાવી શકે.","Device admin: એપને સામાન્ય રીતે અનઇન્સ્ટૉલ કરી શકાતી નથી.","Install unknown apps: એ એપ ચૂપચાપ બીજી એપ્સ ઇન્સ્ટૉલ કરી શકે.","Notification access: એપ દરેક નોટિફિકેશન વાંચી શકે, OTP પણ.","લોન, ગેમ કે 'રિવૉર્ડ' એપમાં Read SMS: OTP ચોરી આમ જ થાય છે."],
    managerTitle:"પહેલાં આપેલી પરવાનગીઓ તપાસો",
    manager:["Settings ખોલો અને 'Permission manager' શોધો (કેટલાક ફોનમાં: Privacy, પછી Permission manager).","SMS, Contacts કે Location જેવી પરવાનગી પર ટૅપ કરો અને જુઓ કઈ એપ્સ પાસે છે.","જે એપને જરૂર નથી તેમાંથી દૂર કરો. એપ તો પણ ચાલતી રહેશે."],
    tip:"SMS, Contacts, Location, Microphone અને Camera માટે આ એક વાર કરો. 5 મિનિટ લાગે છે."
  },
  scams:{
    eyebrow:"ઠગાઈ ઓળખો, નંબર જાણો", title:"ભારતમાં સામાન્ય ઠગાઈ અને શું કરવું",
    intro:"ઠગો ગભરાટ કે લાલચ ઊભાં કરે છે જેથી તમે ઉતાવળમાં પગલું ભરો. જેવું કોઈ તમને ઉતાવળ કરાવે, અટકી જાઓ. નીચે: દરેક ઠગાઈ કેવી દેખાય છે, સૌથી પહેલાં શું કરવું, અને ક્યાં ફરિયાદ કરવી.",
    goldenTitle:"જો પૈસા ખાતામાંથી જતા રહ્યા હોય",
    golden:"સૌથી પહેલાં, હમણાં જ 1930 પર કૉલ કરો. જેટલો વહેલો કૉલ કરશો, એટલી વધુ શક્યતા કે ઠગ ઉપાડે તે પહેલાં પૈસા ફ્રીઝ થઈ જાય. પછી cybercrime.gov.in પર ફરિયાદ નોંધાવો અને તમારી બેંકને જાણ કરો.",
    k:{looks:"કેવી દેખાય છે", act:"આ કરો", report:"અહીં ફરિયાદ કરો"},
    items:[
      {n:"UPI / OTP ઠગાઈ", looks:"'તમારું ખાતું બંધ થઈ જશે, OTP કહો.' '₹5,000 મેળવવા ₹1 મોકલો.' એવી 'collect request' જે તમારો PIN માંગે.", act:"OTP કે UPI PIN ક્યારેય ન કહો. PIN નાખવાથી પૈસા હંમેશાં જાય છે, આવતા નથી. પૈસા ગયા હોય તો 1930 પર કૉલ કરો.", report:["h1930","cybercrime","bank"]},
      {n:"ડિજિટલ અરેસ્ટ / નકલી પોલીસ-CBI વીડિયો કૉલ", looks:"'CBI / પોલીસ / કસ્ટમ' અધિકારીનો વીડિયો કૉલ. 'તમારા પાર્સલમાં ડ્રગ્સ છે.' 'તમારું આધાર મની લૉન્ડરિંગ સાથે જોડાયેલું છે.' કલાકો સુધી કૉલ પર રોકી રાખે છે.", act:"પોલીસ ક્યારેય વીડિયો કૉલ પર ધરપકડ કરતી નથી કે પૈસા માંગતી નથી. કૉલ કાપો. 1930 કે 112 પર કૉલ કરો.", report:["h1930","cybercrime","h112"]},

  help:{

/* ---------- Android UI mockups (inline SVG) ---------- */
const UI = (() => {
  const FF = "font-family='Roboto,Noto Sans,Arial,sans-serif'";
  const C = {ink:"#1F2333", mut:"#6B7390", line:"#E4E7EF", acc:"#E4590B", grn:"#1E8E3E", red:"#C8321F", blue:"#1A73E8", soft:"#F1F3F4"};
  let uid = 0;
  const T = (x,y,s,o={}) => `<text x="${x}" y="${y}" font-size="${o.s||14}" font-weight="${o.w||400}" fill="${o.c||C.ink}"${o.a?` text-anchor="${o.a}"`:""} ${FF}>${esc(s)}</text>`;
  const toggle = (x,y,on) => `<rect x="${x}" y="${y}" width="46" height="26" rx="13" fill="${on?C.grn:"#C2C6D0"}"/><circle cx="${on?x+33:x+13}" cy="${y+13}" r="10" fill="#fff"/>`;
  const ring = (x,y,r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${C.acc}" stroke-width="3.5"/><circle class="pulse" cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${C.acc}" stroke-width="3"/>`;
  const ringRect = (x,y,w,h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="none" stroke="${C.acc}" stroke-width="3.5"/>`;
  const badge = (x,y,n) => `<circle cx="${x}" cy="${y}" r="14" fill="${C.acc}" stroke="#fff" stroke-width="2"/>${T(x,y+5,String(n),{s:15,w:700,c:"#fff",a:"middle"})}`;
  const shield = (cx,cy,size,color,glyph) => {
    const k = size/24;
    const inner = glyph === "!" ? `<rect x="10.9" y="7" width="2.2" height="7" rx="1.1" fill="#fff"/><circle cx="12" cy="16.8" r="1.4" fill="#fff"/>` : `<path d="M8 12.2l2.6 2.6 5.4-5.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;

let LANG = "en";
const $ = s => document.querySelector(s);

const olink = (url, label) => `<a class="olink" href="${url}" target="_blank" rel="noopener">${esc(label)} ${ICON.ext}</a>`;

function shareUrl() {
  try {
    const u = new URL(location.href); u.hash = "";
    if (u.protocol !== "file:") u.searchParams.set("lang", LANG);
    return u.toString() + "#lang-" + LANG;
  } catch (e) { return location.href; }
}
function shareBlock(t) {
  const url = shareUrl(), msg = t.share.msg, e = encodeURIComponent;
  const isFile = location.protocol === "file:";
  const btns = isFile ? "" : `
<a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${e(msg + " " + url)}">${ICON.chat}WhatsApp</a>
<a class="fb" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${e(url)}">${ICON.share}Facebook</a>
<a class="x" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${e(msg)}&url=${e(url)}">${ICON.share}X</a>
<a class="li" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${e(url)}">${ICON.share}LinkedIn</a>
<a class="tg" target="_blank" rel="noopener" href="https://t.me/share/url?url=${e(url)}&text=${e(msg)}">${ICON.chat}Telegram</a>
<button type="button" data-copy="${esc(url)}" data-done="${esc(t.share.copied)}">${ICON.link}${esc(t.share.copy)}</button>
<button type="button" data-native="1" hidden>${ICON.share}${esc(t.share.more)}</button>`;
  return `<div class="share-box"><h3>${esc(t.share.title)}</h3><p>${esc(t.share.text)}</p>
<div class="share">${btns}${isFile ? `<button type="button" data-copy="${esc(msg + " " + url)}" data-done="${esc(t.share.copied)}">${ICON.link}${esc(t.share.copy)}</button>` : ""}</div>
${isFile ? `<p class="note">${esc(t.share.hostNote)}</p>` : ""}</div>`;
}

  const d = HELP[id], L = t.help.labels[id];

  else if (d.host) { pri = `<div class="pri host">${esc(d.host)}</div>`; acts += `<a class="bt p" href="${d.url}" target="_blank" rel="noopener">${esc(t.common.open)} ${ICON.ext}</a><button class="bt" type="button" data-copy="${esc(d.url)}" data-done="${esc(t.common.copied)}">${esc(t.common.copy)}</button>`; }
  else if (d.addr) { pri = `<div class="pri host">${esc(L.s)}</div>`; sec = `<span class="sec">${esc(d.addr)}</span>`; acts += `<button class="bt" type="button" data-copy="${esc(d.addr)}" data-done="${esc(t.common.copied)}">${esc(t.common.copy)}</button>`; }
  else { pri = `<div class="pri host">${esc(L.s)}</div>`; }

}

/* ---------- events ---------- */
function copyText(text, btn) {
  const done = () => { const old = btn.innerHTML; btn.textContent = btn.dataset.done || "✓"; btn.classList.add("done"); setTimeout(() => { btn.innerHTML = old; btn.classList.remove("done"); }, 1600); };
  const fallback = () => { try { const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly",""); ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); done(); } catch (e) {} };
  try { navigator.clipboard.writeText(text).then(done).catch(fallback); } catch (e) { fallback(); }
}
document.addEventListener("click", e => {
  const lb = e.target.closest("[data-lang]");
  if (lb) { setLang(lb.dataset.lang, true); return; }
  const cb = e.target.closest("[data-copy]");
  if (cb) { copyText(cb.dataset.copy, cb); return; }
  const nb = e.target.closest("[data-native]");
  if (nb) { const t = I18N[LANG]; try { navigator.share({title:"Cyber Suraksha Manual", text:t.share.msg, url:shareUrl()}).catch(() => {}); } catch (err) {} }
});
document.addEventListener("change", e => {
  const ck = e.target.closest("[data-ck]");
  if (!ck) return;
  try { const arr = Array.from(document.querySelectorAll("[data-ck]")).map(x => x.checked); localStorage.setItem("csm-check", JSON.stringify(arr)); } catch (err) {}
});
function setLang(code, user) {
  if (!I18N[code]) code = "en";
  LANG = code;
  try { if (user) localStorage.setItem("csm-lang", code); } catch (e) {}
  render();
}
function detectLang() {
  const m = location.hash.match(/^#lang-(en|hn|hi|gu)$/); if (m) return m[1];
  try { const q = new URLSearchParams(location.search).get("lang"); if (q && I18N[q]) return q; } catch (e) {}
  try { const s = localStorage.getItem("csm-lang"); if (s && I18N[s]) return s; } catch (e) {}
  const nl = (navigator.language || "").toLowerCase();
  if (nl.startsWith("gu")) return "gu";
  if (nl.startsWith("hi")) return "hi";
  return "en";
}
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#lang-(en|hn|hi|gu)$/); if (m && m[1] !== LANG) setLang(m[1], false); });
setLang(detectLang(), false);
</script>
